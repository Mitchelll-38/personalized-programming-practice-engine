name: practice-engine-local
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      PRACTICE_DB_PATH: /app/.data/demo.sqlite3
    volumes:
      - type: bind
        source: ${PRACTICE_DEMO_DATA_DIR:-../.data/private/data/container-demo}
        target: /app/.data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PRACTICE_DEMO_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 10
