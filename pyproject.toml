[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "personalized-programming-practice-engine"
version = "0.1.0"
description = "Leakage-aware programming knowledge tracing research and replay demo"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<0.137", "pydantic>=2.10,<3", "uvicorn>=0.34,<0.43"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<0.29"]
research = ["scikit-learn>=1.6,<2", "numpy>=2.0,<3"]

[project.scripts]
practice-data = "practice_engine.data.cli:main"

[tool.setuptools]
package-dir = {"practice_engine" = "src/practice_engine", "api" = "api"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["practice_engine*", "api"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
