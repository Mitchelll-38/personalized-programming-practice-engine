name: CPU neural and encoder checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  neural:
    runs-on: ubuntu-24.04
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      HF_HOME: ${{ github.workspace }}/.data/private/data/encoders/huggingface
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PIP_CACHE_DIR: ${{ github.workspace }}/.data/private/data/package-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock -r requirements-neural.lock -r requirements-encoder.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -c "import api.main, sys; assert 'transformers' not in sys.modules; assert 'torch' not in sys.modules"
      - run: python -c "import torch; assert torch.version.cuda is None"
      - run: python -c "from transformers import AutoTokenizer, RobertaModel; import tokenizers, safetensors"
      - run: python -m pytest -q
