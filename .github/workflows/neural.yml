name: CPU neural checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  neural:
    runs-on: ubuntu-24.04
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock -r requirements-neural.lock
      - run: python -m pip install --no-deps -e .
      - run: python -c "import torch; assert torch.version.cuda is None"
      - run: python -m pytest -q
